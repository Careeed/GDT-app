<!doctype html><html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ludoteca</title>
<style>
:root{--bg:#123a33;--sf:#1b4b42;--sf2:#245c51;--tx:#f1ede2;--mu:#a9c2b8;--ac:#f2b632;--bad:#ff8a73;--ok:#8fe0a8}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
#app{max-width:640px;margin:auto;padding:12px 16px 90px}
h1,h2,h3{font-family:Georgia,serif;font-weight:700;line-height:1.2}
h1{font-size:30px}h2{font-size:22px;margin:4px 0 10px}
header{display:flex;align-items:center;gap:10px;margin:8px 0 16px}
header h1,header h2{flex:1;margin:0}
button{font:inherit;border:0;border-radius:10px;padding:10px 16px;background:var(--ac);color:#241a00;font-weight:600}
button.g{background:var(--sf2);color:var(--tx)}
a.btn{display:inline-block;border-radius:10px;padding:10px 16px;background:var(--sf2);color:var(--tx);font-weight:600;text-decoration:none}
button.r{background:none;color:var(--bad);padding:6px 0}
button.i{background:var(--sf);color:var(--tx);padding:8px 12px}
.card{background:var(--sf);border-radius:16px 16px 16px 4px;padding:14px 16px;margin:0 0 10px}
.card small{display:block;color:var(--mu)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:8px}
.chip{flex:none;background:var(--sf);color:var(--tx);border-radius:20px;padding:6px 12px;font-size:14px}
.chip.on{background:var(--ac);color:#241a00}
input,textarea{width:100%;font:inherit;color:var(--tx);background:var(--sf);border:1px solid var(--sf2);border-radius:10px;padding:10px;margin:6px 0}
textarea{min-height:90px}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:#0c2924;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.tabs button{flex:1;background:none;color:var(--mu);padding:8px 2px;font-size:13px}
.tabs button.on{color:var(--ac)}
.msg{padding:10px 14px;margin:8px 0;border-radius:14px;background:var(--sf)}
.msg.u{background:var(--sf2);margin-left:36px}
.ok{color:var(--ok)}.no{color:var(--bad)}
ul{padding-left:20px}
#busy{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;text-align:center;padding:30px;font-size:18px;z-index:9}
#busy[hidden]{display:none}
.mu{color:var(--mu)}
</style></head><body><div id="app"></div><div id="busy" hidden></div>
<script src="pdf.min.js"></script>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc='pdf.worker.min.js';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const md=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/^[-•] (.+)$/gm,'<li>$1</li>').replace(/(<li>.*<\/li>\n?)+/g,m=>'<ul>'+m.replace(/\n/g,'')+'</ul>').replace(/\n/g,'<br>');
const J=t=>JSON.parse(t.slice(t.search(/[\[{]/),Math.max(t.lastIndexOf('}'),t.lastIndexOf(']'))+1));
const DB=new Promise(r=>{const q=indexedDB.open('lud',1);q.onupgradeneeded=()=>q.result.createObjectStore('k');q.onsuccess=()=>r(q.result)});
const tx=async(m,f)=>{const d=await DB;return new Promise((res,rej)=>{const q=f(d.transaction('k',m).objectStore('k'));q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})};
const get=k=>tx('readonly',s=>s.get(k)),put=(k,v)=>tx('readwrite',s=>s.put(v,k));
let games=[],S={v:'home',tab:'ripasso'},G=null,quiz=null;
const save=()=>put('games',games);
const cfg=()=>({k:localStorage.getItem('key')||'',m:localStorage.getItem('model')||'gemini-flash-latest'});
const CH=['Obiettivo','Preparazione','Turno','Azioni','Regole speciali','Fine partita e punteggio'];

function settings(){const k=prompt('Chiave API Gemini (gratis su aistudio.google.com/apikey)',cfg().k);if(k!==null)localStorage.setItem('key',k.trim());const m=prompt('Modello',cfg().m);if(m)localStorage.setItem('model',m.trim())}
const rules=g=>g.docs.map(d=>d.pages.map((t,i)=>`[${d.name}, p.${i+1}] ${t}`).join('\n')).join('\n\n').slice(0,600000);

async function ai(g,msgs,max=4000,extra=''){
  const {k,m}=cfg();if(!k){settings();throw Error('Serve la chiave API Gemini (⚙)')}
  const sys=`Sei un esperto di giochi da tavolo. Rispondi in italiano usando SOLO il regolamento qui sotto; se un'informazione manca, dillo. Il testo è diviso per pagina con etichette [documento, p.N].\n\n`+rules(g)+(extra?'\n\n'+extra:'');
  const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${m}:generateContent`,{method:'POST',headers:{'content-type':'application/json','x-goog-api-key':k},body:JSON.stringify({systemInstruction:{parts:[{text:sys}]},contents:msgs.map(x=>({role:x.role=='user'?'user':'model',parts:[{text:x.content}]})),generationConfig:{maxOutputTokens:max*3}})});
  const j=await r.json();
  if(!r.ok)throw Error(r.status==429?'Limite gratuito raggiunto: riprova tra un minuto (o domani).':(j.error?.message||r.status));
  const t=(j.candidates?.[0]?.content?.parts||[]).map(x=>x.text||'').join('');
  if(!t)throw Error('Risposta vuota, riprova.');return t;
}
async function run(msg,f){const b=$('#busy');b.textContent=msg;b.hidden=false;try{await f()}catch(e){alert('Errore: '+e.message)}b.hidden=true;render()}

async function readPdf(file){
  const d=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise,pages=[];
  for(let i=1;i<=d.numPages;i++){const c=await(await d.getPage(i)).getTextContent();pages.push(c.items.map(x=>x.str).join(' ').replace(/\s+/g,' ').trim())}
  if(pages.join('').length<200)throw Error('Il PDF non contiene testo (forse è una scansione).');
  return pages;
}
const addGame=()=>{const n=$('#gn').value.trim(),f=$('#gf').files[0];if(!n||!f)return alert('Inserisci nome e PDF');return run('Leggo il PDF...',async()=>{games.push({id:Date.now(),name:n,docs:[{name:'Base',pages:await readPdf(f)}],done:{},last:0,mistakes:[],chat:[]});await save()})};
const addDoc=()=>{const f=$('#df').files[0];if(!f)return;const n=prompt('Nome del documento',f.name.replace(/\.pdf$/i,''));if(!n)return;return run('Leggo il PDF...',async()=>{G.docs.push({name:n,pages:await readPdf(f)});await save()})};
const delGame=()=>{if(confirm('Eliminare '+G.name+'?')){games=games.filter(x=>x!==G);G=null;S.v='home';save();render()}};

const genStudy=()=>run('Preparo il ripasso (può richiedere 1-2 minuti)...',async()=>{
  const t=await ai(G,[{role:'user',content:`Trasforma il regolamento in un ripasso completo. Rispondi SOLO con JSON:
{"summary":"scheda riassuntiva di max 150 parole","chapters":[{"t":"titolo","c":"spiegazione completa e chiara con elenchi puntati (- ) e **grassetto** per i termini chiave, citando le pagine","p":"pagine di riferimento"}],"quick":{"prep":"preparazione in breve","order":"ordine dei turni e cosa si fa","scoring":"come si calcola il punteggio e quando finisce","forgotten":["5 regole che si dimenticano più spesso, con pagina"]}}
I capitoli devono essere esattamente, in ordine: ${CH.join(', ')}.`}],8000);
  G.study=J(t);G.done={};G.last=0;await save()});

const startQuiz=()=>run('Preparo le domande...',async()=>{
  const m=G.mistakes.map(x=>x.q).join(' | ');
  const t=await ai(G,[{role:'user',content:`Genera 8 domande a difficoltà crescente (dalle basi ai casi particolari) per verificare che ricordi il regolamento. ${m?'Includi varianti di queste che ho sbagliato: '+m+'. ':''}Solo JSON: [{"q":"","a":"risposta corretta sintetica","ch":"capitolo","p":"pagina"}]`}],3000);
  quiz={queue:J(t),i:0,ok:0,fb:null,n:8}});
const grade=()=>{const a=$('#ans').value.trim();if(!a)return;const x=quiz.queue[quiz.i];
  return run('Correggo...',async()=>{const j=J(await ai(G,[{role:'user',content:`Domanda: ${x.q}\nRisposta corretta: ${x.a}\nRisposta dell'utente: ${a}\nSii indulgente sui dettagli secondari. Solo JSON: {"ok":true,"fb":"correzione breve che cita la regola e la pagina"} (ok true/false)`}],600));
    quiz.fb=j;
    if(j.ok){if(!x.retry)quiz.ok++;G.mistakes=G.mistakes.filter(m=>m.q!==x.q)}
    else{if(!G.mistakes.some(m=>m.q===x.q))G.mistakes.push({q:x.q,a:x.a,ch:x.ch,p:x.p});if(!x.retry)quiz.queue.push({...x,retry:1})}
    await save()})};
const next=()=>{quiz.i++;quiz.fb=null;render()};

const send=()=>{const v=$('#msg').value.trim();if(!v)return;G.chat.push({role:'user',content:v});
  return run('Cerco nel regolamento...',async()=>{try{G.chat.push({role:'assistant',content:await ai(G,G.chat.slice(-12),1500,'Rispondi in modo chiaro e conciso. Chiudi sempre con "Fonte: capitolo/sezione, documento, pagina X".')});await save()}catch(e){G.chat.pop();throw e}})};
function share(){const q=G.study.quick;const t=`🎲 ${G.name} - ripasso rapido\n\nPREPARAZIONE\n${q.prep}\n\nORDINE DEI TURNI\n${q.order}\n\nPUNTEGGIO\n${q.scoring}\n\nDA NON DIMENTICARE\n- ${q.forgotten.join('\n- ')}`;
  navigator.share?navigator.share({title:G.name,text:t}).catch(()=>{}):navigator.clipboard.writeText(t).then(()=>alert('Copiato negli appunti'))}

const st=g=>g.study?`${Object.keys(g.done).length}/${g.study.chapters.length} capitoli ripassati`+(g.mistakes.length?`, ${g.mistakes.length} da rivedere`:''):'Ripasso da generare';
const gen=m=>`<div class=card><p>${m}</p><div class=row><button onclick="genStudy()">Genera il ripasso</button></div></div>`;

function home(){return `<header><h1>Ludoteca</h1><button class=i onclick="settings()">⚙</button></header>`+
  (games.map(g=>`<div class=card onclick="G=games.find(x=>x.id==${g.id});S.v='game';S.tab='ripasso';quiz=null;render()"><b>${esc(g.name)}</b><small>${st(g)}</small></div>`).join('')||'<p class=mu>Nessun gioco ancora. Aggiungi il primo regolamento.</p>')+
  `<div class=card><h3>Nuovo gioco</h3><input id=gn placeholder="Nome del gioco"><input id=gf type=file accept="application/pdf"><div class=row><button onclick="addGame()">Aggiungi</button></div></div>`}

function game(){
  const T=[['ripasso','Ripasso'],['quiz','Interrogami'],['serata','Serata'],['chat','Chiedi'],['scheda','Scheda']];
  let b='';const s=G.study;
  if(S.tab=='ripasso'){
    if(!s)b=gen('Ancora nessun ripasso per questo gioco.');
    else{const i=G.last,c=s.chapters[i];
      b=`<div class=chips>${s.chapters.map((x,j)=>`<span class="chip ${j==i?'on':''}" onclick="G.last=${j};save();render()">${G.done[j]?'✓ ':''}${esc(x.t)}</span>`).join('')}</div>
      <div class=card><h2>${esc(c.t)}</h2>${md(c.c)}<small style="margin-top:10px">Pagine: ${esc(c.p)}</small></div>
      <div class=row><button class=g onclick="G.last=Math.max(0,G.last-1);save();render()">Indietro</button><button onclick="G.done[G.last]=1;G.last=Math.min(G.last+1,${s.chapters.length-1});save();render()">Ho capito, avanti</button></div>`}
  }else if(S.tab=='quiz'){
    if(!s)b=gen('Prima serve il ripasso.');
    else if(!quiz)b=`<div class=card><h2>Interrogami</h2><p>8 domande a difficoltà crescente. Le regole che sbagli tornano alla fine.</p>${G.mistakes.length?`<p class=no>${G.mistakes.length} regole sbagliate in passato verranno riproposte.</p>`:''}<div class=row><button onclick="startQuiz()">Inizia</button></div></div>`;
    else if(quiz.i>=quiz.queue.length)b=`<div class=card><h2>Finito: ${quiz.ok}/${quiz.n}</h2>${G.mistakes.length?'<p>Da rivedere:</p><ul>'+G.mistakes.map(m=>`<li>${esc(m.q)} <span class=mu>(${esc(m.ch)}, p. ${esc(m.p)})</span></li>`).join('')+'</ul>':'<p class=ok>Nessun errore aperto.</p>'}<div class=row><button onclick="quiz=null;render()">Ancora</button></div></div>`;
    else{const x=quiz.queue[quiz.i];
      b=`<div class=card><small>${x.retry?'Riprova — ':''}Domanda ${quiz.i+1}/${quiz.queue.length}</small><h3 style="margin-top:6px">${esc(x.q)}</h3>${quiz.fb?`<textarea disabled>${esc($('#ans')?.value||'')}</textarea><p class="${quiz.fb.ok?'ok':'no'}"><b>${quiz.fb.ok?'Corretto.':'Non esatto.'}</b> ${esc(quiz.fb.fb)}</p><small>${esc(x.ch)}, p. ${esc(x.p)}</small><div class=row><button onclick="next()">Avanti</button></div>`:`<textarea id=ans placeholder="La tua risposta"></textarea><div class=row><button onclick="grade()">Verifica</button></div>`}</div>`}
  }else if(S.tab=='serata'){
    if(!s)b=gen('Prima serve il ripasso.');
    else{const q=s.quick;b=`<div class=card><h2>${esc(G.name)}</h2><h3>Preparazione</h3><p>${md(q.prep)}</p><h3 style="margin-top:12px">Ordine dei turni</h3><p>${md(q.order)}</p><h3 style="margin-top:12px">Punteggio</h3><p>${md(q.scoring)}</p><h3 style="margin-top:12px">Da non dimenticare</h3><ul>${q.forgotten.map(f=>`<li>${esc(f)}</li>`).join('')}</ul>${G.mistakes.length?'<h3 style="margin-top:12px">I tuoi errori ricorrenti</h3><ul>'+G.mistakes.map(m=>`<li>${esc(m.a)} <span class=mu>(p. ${esc(m.p)})</span></li>`).join('')+'</ul>':''}</div><div class=row><button onclick="share()">Condividi con gli amici</button></div>`}
  }else if(S.tab=='chat'){
    b=(G.chat.map(m=>`<div class="msg ${m.role=='user'?'u':''}">${md(m.content)}</div>`).join('')||'<p class=mu>Chiedi un caso particolare: risponderò dal regolamento, con capitolo e pagina.</p>')+`<textarea id=msg placeholder="Es. Posso scambiare risorse fuori dal mio turno?"></textarea><div class=row><button onclick="send()">Invia</button><a class=btn href="https://notebooklm.google.com" target="_blank">Apri NotebookLM</a>${G.chat.length?'<button class=g onclick="G.chat=[];save();render()">Svuota chat</button>':''}</div>`;
  }else{
    b=`<div class=card><h2>Scheda</h2>${s?md(s.summary):'<p class=mu>Nessuna scheda: genera il ripasso.</p>'}<div class=row><button class=g onclick="genStudy()">${s?'Rigenera ripasso':'Genera ripasso'}</button></div></div>
    <div class=card><h3>Documenti</h3><ul>${G.docs.map(d=>`<li>${esc(d.name)} <span class=mu>(${d.pages.length} pagine)</span></li>`).join('')}</ul><input id=df type=file accept="application/pdf" onchange="addDoc()"><small>Aggiungi un'espansione, poi rigenera il ripasso.</small></div>
    <button class=r onclick="delGame()">Elimina gioco</button>`}
  return `<header><button class=i onclick="S.v='home';render()">←</button><h2>${esc(G.name)}</h2></header>${b}<nav class=tabs>${T.map(t=>`<button class="${S.tab==t[0]?'on':''}" onclick="S.tab='${t[0]}';render()">${t[1]}</button>`).join('')}</nav>`}

function render(){$('#app').innerHTML=S.v=='home'||!G?home():game();window.scrollTo(0,0)}
(async()=>{games=await get('games')||[];render()})();
</script></body></html>
